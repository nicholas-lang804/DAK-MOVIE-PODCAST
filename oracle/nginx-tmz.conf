# TMZ media server — signed-URL Nginx config (Oracle ARM64, Ubuntu)
# Install: /etc/nginx/sites-available/tmz-media -> symlink to sites-enabled
# Secret file: /etc/nginx/tmz_media_secret  (chmod 600, matches media_remote_token)

limit_req_zone $binary_remote_addr zone=media:10m rate=50r/s;

server {
    listen 443 ssl;
    server_name media.yourdomain.com;   # <-- set your domain

    ssl_certificate     /etc/letsencrypt/live/media.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/media.yourdomain.com/privkey.pem;

    root /srv/tmz-media;
    autoindex off;
    server_tokens off;

    # Shared secret for secure_link
    set $tmz_secret "";

    location / {
        # secure_link: exp=unix_ts&sig=md5("<uri><exp><secret>")
        secure_link $arg_exp,$arg_sig;
        secure_link_md5 "$secure_link_expires$uri$tmz_secret";

        if ($secure_link = "")            { return 403; }
        if ($secure_link = "0")           { return 410; }

        types { }
        default_type application/octet-stream;

        # Range requests for MP4 seeking (native with static files)
        add_header Accept-Ranges bytes;
        add_header Cache-Control "private, max-age=300";
        add_header X-Content-Type-Options nosniff;

        try_files $uri =404;
    }

    # HLS playlists must not be cached long; segments may cache briefly
    location ~* \.m3u8$ {
        secure_link $arg_exp,$arg_sig;
        secure_link_md5 "$secure_link_expires$uri$tmz_secret";
        if ($secure_link = "")  { return 403; }
        if ($secure_link = "0") { return 410; }
        types { }
        default_type application/vnd.apple.mpegurl;
        add_header Cache-Control "private, max-age=30";
        try_files $uri =404;
    }

    location ~* \.(ts|m4s|mp4|webm)$ {
        limit_req zone=media burst=20 nodelay;
        secure_link $arg_exp,$arg_sig;
        secure_link_md5 "$secure_link_expires$uri$tmz_secret";
        if ($secure_link = "")  { return 403; }
        if ($secure_link = "0") { return 410; }
        types { }
        default_type video/mp4;
        add_header Accept-Ranges bytes;
        add_header Cache-Control "private, max-age=300";
        try_files $uri =404;
    }

    # Never serve dotfiles / partial uploads / secrets
    location ~ /\. { deny all; }
    location ~* \.(tmp|part|log|sql|zip)$ { deny all; }
}
